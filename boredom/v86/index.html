<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v86 Emulator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            margin-bottom: 5px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Dedicated container for the loading text, placed safely away from the canvas */
        #loading_status {
            height: 20px;
            margin-bottom: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #2ecc71;
        }

        button, label {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover, label:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }

        .btn-active {
            background-color: #2ecc71 !important;
        }
        .btn-active:hover {
            background-color: #27ae60 !important;
        }

        #iso_file {
            display: none;
        }

        #screen_container {
            background-color: #000;
            border: 2px solid #555;
            width: 720px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        #screen_container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
        }

        #screen_container div {
            white-space: pre !important;
            font-family: monospace !important;
            font-size: 14px !important;
            line-height: 14px !important;
            color: #ffffff !important;
            background-color: #000000 !important;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        #screen_container canvas {
            display: block !important;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <h1>v86 Emulator Matrix</h1>
    
    <div class="controls">
        <button id="fullscreen_btn">🖥️ Enter Fullscreen</button>
        <label for="iso_file">💿 Upload ISO</label>
        <input type="file" id="iso_file" accept=".iso">
        <button id="acpi_btn">🔌 ACPI: OFF</button>
        <button id="reset_btn" style="background-color: #e74c3c;">🔄 Reset CPU</button>
    </div>

    <!-- The loading messages will live here now, keeping the emulator screen perfectly clear -->
    <div id="loading_status"></div>
    
    <!-- This container now stays completely clean for SeaBIOS and the OS canvas -->
    <div id="screen_container"></div>

    <script src="libv86.js"></script>
    <script>
        window.onload = function() {
            const EmulatorConstructor = window.V86Starter || window.V86;
            const container = document.getElementById("screen_container");
            const statusBox = document.getElementById("loading_status");
            const fsButton = document.getElementById("fullscreen_btn");
            const fileInput = document.getElementById("iso_file");
            const resetButton = document.getElementById("reset_btn");
            const acpiButton = document.getElementById("acpi_btn");

            let currentIsoBuffer = null;
            let acpiEnabled = false; 

            function startEmulator(cdromBuffer) {
                if (window.emulator) {
                    try { window.emulator.destroy(); } catch(e) {}
                }

                // Empty out the container so the canvas layers bind flawlessly 
                container.innerHTML = "";
                statusBox.innerHTML = "⏳ Initializing hardware layers...";

                const config = {
                    wasm_path: "v86.wasm",
                    screen_container: container,
                    bios: { url: "seabios.bin" },
                    vga_bios: { url: "vgabios.bin" },
                    
                    memory_size: 256 * 1024 * 1024,      
                    vga_memory_size: 16 * 1024 * 1024,   
                    acpi: acpiEnabled,                  
                    
                    autostart: true,
                    disable_keyboard: false,
                    disable_mouse: false
                };

                if (cdromBuffer) {
                    config.cdrom = { buffer: cdromBuffer };
                }

                window.emulator = new EmulatorConstructor(config);

                // Update the dedicated text status element outside the screen layout
                window.emulator.add_listener("download-progress", function(e) {
                    let fileName = e.url ? e.url.split('/').pop() : "ISO Data Stream";
                    statusBox.innerHTML = `⏳ Streaming ${fileName}... (${Math.round(e.loaded / 1024)} KB loaded)`;
                });

                // Clear the loading status element once the CPU turns on
                window.emulator.add_listener("emulator-ready", function() {
                    statusBox.innerHTML = "✅ Ready";
                });
            }

            // Start up in standard default initialization state
            startEmulator(null);

            fileInput.addEventListener("change", function(e) {
                const file = e.target.files;
                if (file && file[0]) {
                    currentIsoBuffer = file[0];
                    startEmulator(currentIsoBuffer);
                }
            });

            acpiButton.addEventListener("click", function() {
                acpiEnabled = !acpiEnabled;
                if (acpiEnabled) {
                    acpiButton.innerText = "🔌 ACPI: ON";
                    acpiButton.classList.add("btn-active");
                } else {
                    acpiButton.innerText = "🔌 ACPI: OFF";
                    acpiButton.classList.remove("btn-active");
                }
                startEmulator(currentIsoBuffer);
            });

            resetButton.addEventListener("click", function() {
                if (window.emulator) {
                    window.emulator.restart();
                }
            });

            fsButton.addEventListener("click", function() {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => console.error(err.message));
                } else {
                    document.exitFullscreen();
                }
            });
            document.addEventListener("fullscreenchange", function() {
                fsButton.innerHTML = document.fullscreenElement ? "❌ Exit Fullscreen" : "🖥️ Enter Fullscreen";
            });
        };
    </script>
</body>
</html>
