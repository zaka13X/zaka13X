<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v86</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Style the container to frame the emulator screen */
        #screen_container {
            background-color: #000;
            border: 2px solid #555;
        }
        /* Ensure v86 graphical canvas or text layout wraps nicely */
        #screen_container canvas {
            display: block;
        }
        #screen_container div {
            white-space: pre;
            font: 14px monospace;
            line-height: 14px;
        }
    </style>
</head>
<body>

    <h1>v86</h1>
    
    <!-- This container is where v86 will automatically inject the emulator screen -->
    <div id="screen_container"></div>

    <!-- Load v86 engine -->
    <script src="/boredom/v86/libv86.js"></script>
    <script>
        window.onload = function() {
            window.emulator = new V86({
                // Required path to your WebAssembly binary
                wasm_path: "/boredom/v86/v86.wasm",
                
                // Point directly to the parent container element
                screen_container: document.getElementById("screen_container"),
                
                // BIOS and OS image assets
                bios: { url: "/boredom/v86/seabios.bin" },
                vga_bios: { url: "/boredom/v86/vgabios.bin" },
                cdrom: { url: "/index.iso" },
                
                // Resources allocations
                memory_size: 256 * 1024 * 1024, // Reduced to 256MB for better browser compatibility
                vga_memory_size: 8 * 1024 * 1024, // Standard 8MB VGA allocation
                
                // Interaction settings
                autostart: true,
                disable_keyboard: false,
                disable_mouse: false,
                
                // Network Configuration via WebSocket relay
                network_relay_url: "wss://relay.widgetry.org/"
            });
        };
    </script>
</body>
</html>
