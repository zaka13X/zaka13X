<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v86</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #screen_container {
            background-color: #000;
            border: 2px solid #555;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h1>v86</h1>
    
    <!-- CRITICAL FIX: The inner structure must exist for SeaBIOS text elements -->
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px; color: #fff;"></div>
        <canvas style="display: none"></canvas>
    </div>

    <!-- FIXED PATH: Directly references the file since it is in the same directory -->
    <script src="libv86.js"></script>
    <script>
        window.onload = function() {
            window.emulator = new V86({
                // FIXED PATHS: No directory prefixes since files match index.html location
                wasm_path: "v86.wasm",
                screen_container: document.getElementById("screen_container"),
                
                bios: { url: "seabios.bin" },
                vga_bios: { url: "vgabios.bin" },
                cdrom: { url: "../../index.iso" }, // Adjusted assuming index.iso is at your root directory
                
                memory_size: 256 * 1024 * 1024, 
                vga_memory_size: 8 * 1024 * 1024, 
                autostart: true,
                disable_keyboard: false,
                disable_mouse: false,
                network_relay_url: "wss://relay.widgetry.org/"
            });
        };
    </script>
</body>
</html>
