<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v86 Emulator Frame</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button, label {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover, label:hover {
            background-color: #2980b9;
        }

        /* Input is hidden because the <label> acts as the button */
        #iso_file {
            display: none;
        }

        #screen_container {
            background-color: #000;
            border: 2px solid #555;
            width: 720px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        #screen_container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
        }

        #screen_container div {
            white-space: pre !important;
            font-family: monospace !important;
            font-size: 14px !important;
            line-height: 14px !important;
            color: #ffffff !important;
            background-color: #000000 !important;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        #screen_container canvas {
            display: block !important;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <h1>v86</h1>
    
    <div class="controls">
        <button id="fullscreen_btn">Enter Fullscreen</button>
        <!-- This label acts as a stylized upload button -->
        <label for="iso_file">Upload & Boot ISO</label>
        <input type="file" id="iso_file" accept=".iso">
    </div>
    
    <div id="screen_container"></div>

    <script src="libv86.js"></script>
    <script>
        window.onload = function() {
            const EmulatorConstructor = window.V86Starter || window.V86;
            const container = document.getElementById("screen_container");
            const fsButton = document.getElementById("fullscreen_btn");
            const fileInput = document.getElementById("iso_file");

            function startEmulator(cdromOptions) {
                // Clear out previous instances or loading messages
                container.innerHTML = "<div id='loading_msg' style='color: #2ecc71;'>⏳ Initializing runtime packages...</div>";

                const config = {
                    wasm_path: "v86.wasm",
                    screen_container: container,
                    bios: { url: "seabios.bin" },
                    vga_bios: { url: "vgabios.bin" },
                    memory_size: 256 * 1024 * 1024, 
                    vga_memory_size: 8 * 1024 * 1024, 
                    autostart: true,
                    disable_keyboard: false,
                    disable_mouse: false,
                    network_relay_url: "wss://relay.widgetry.org/"
                };

                // Append CDROM configuration dynamically if available
                if (cdromOptions) {
                    config.cdrom = cdromOptions;
                }

                window.emulator = new EmulatorConstructor(config);

                // Re-attach progress listeners
                window.emulator.add_listener("download-progress", function(e) {
                    const loadBox = document.getElementById("loading_msg");
                    if (loadBox) {
                        let fileName = e.url ? e.url.split('/').pop() : "System Volume";
                        loadBox.innerHTML = `⏳ Loading ${fileName}... (${Math.round(e.loaded / 1024)} KB stored)`;
                    }
                });

                window.emulator.add_listener("download-error", function(e) {
                    alert("FETCH ERROR:\nFailed to load: " + e.url);
                });
            }

            // 1. Initial boot: Start up in No-ISO fallback mode so you can see SeaBIOS instantly
            startEmulator(null);

            // 2. File Upload Handler: Boots the file instantly when selected
            fileInput.addEventListener("change", function(e) {
                const file = e.target.files[0];
                if (file) {
                    // Pass the raw HTML5 File Object straight into v86
                    startEmulator({ buffer: file });
                }
            });

            // Fullscreen Mapping
            fsButton.addEventListener("click", function() {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => console.error(err.message));
                } else {
                    document.exitFullscreen();
                }
            });
            document.addEventListener("fullscreenchange", function() {
                fsButton.innerHTML = document.fullscreenElement ? "❌ Exit Fullscreen" : "🖥️ Enter Fullscreen";
            });
        };
    </script>
</body>
</html>
