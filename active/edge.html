<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Browser</title>
    <!-- Route scripts through the project's 'active' directory asset path -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --border-color: #e0e0e0;
            --text-color: #242424;
            --input-bg: #ffffff;
            --tab-active: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202020;
                --border-color: #2c2c2c;
                --text-color: #ffffff;
                --input-bg: #2d2d2d;
                --tab-active: #2d2d2d;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Tabs Bar */
        .tab-bar {
            display: flex;
            align-items: flex-end;
            padding: 8px 8px 0 8px;
            background-color: var(--bg-color);
            height: 40px;
        }

        .tab {
            display: flex;
            align-items: center;
            background-color: transparent;
            padding: 6px 16px;
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            max-width: 240px;
            min-width: 140px;
            border: 1px solid transparent;
            border-bottom: none;
            margin-right: 4px;
        }

        .tab.active {
            background-color: var(--tab-active);
            border-color: var(--border-color);
        }

        .tab-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            background: linear-gradient(135deg, #0078d4, #00bcf2);
            border-radius: 4px;
        }

        .tab-close {
            margin-left: auto;
            cursor: pointer;
            border-radius: 4px;
            width: 16px;
            height: 16px;
            text-align: center;
            line-height: 14px;
        }

        .tab-close:hover {
            background-color: rgba(0,0,0,0.1);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            background-color: var(--tab-active);
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background-color: rgba(0,0,0,0.05);
        }

        @media (prefers-color-scheme: dark) {
            .nav-btn:hover { background-color: rgba(255,255,255,0.05); }
        }

        .nav-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Address Bar */
        .address-bar-container {
            flex-grow: 1;
            position: relative;
        }

        .address-bar {
            width: 100%;
            height: 32px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 0 16px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.1s;
        }

        .address-bar:focus {
            border-color: #0078d4;
            box-shadow: 0 0 0 1px #0078d4;
        }

        /* Browser Window Content */
        .content-area {
            flex-grow: 1;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Tab Strip -->
    <div class="tab-bar">
        <div class="tab active">
            <div class="tab-icon"></div>
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Proxy Browser</span>
            <div class="tab-close">&times;</div>
        </div>
    </div>

    <!-- Navigation Toolbar -->
    <div class="toolbar">
        <button class="nav-btn" id="back-btn" title="Back">
            <svg viewBox="0 0 16 16"><path d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/></svg>
        </button>
        <button class="nav-btn" id="forward-btn" title="Forward">
            <svg viewBox="0 0 16 16"><path d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/></svg>
        </button>
        <button class="nav-btn" id="refresh-btn" title="Refresh">
            <svg viewBox="0 0 16 16"><path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-1.395 1.443a2.5 2.5 0 0 0-3.178-1.24.5.5 0 1 1-.52-.855 3.5 3.5 0 0 1 4.73 1.586l.244.429H11.3a1 1 0 0 0-.162-.162z"/><path d="M3.5 11a4.24 4.24 0 0 0 .148.5H1c-.28 0-.5.22-.5.5s.22.5.5.5h3.5c.28 0 .5-.22.5-.5V8.5c0-.28-.22-.5-.5-.5s-.5.22-.5.5v1.393A4.478 4.478 0 0 1 3.5 11z"/></svg>
        </button>
        
        <div class="address-bar-container">
            <input type="text" class="address-bar" id="url-input" placeholder="Search Google or enter URL" value="google.com">
        </div>
    </div>

    <!-- Viewport -->
    <div class="content-area">
        <iframe id="browser-viewport" src=""></iframe>
    </div>
        <script>
        const urlInput = document.getElementById('url-input');
        const viewport = document.getElementById('browser-viewport');
        const refreshBtn = document.getElementById('refresh-btn');

        // Registers service worker using UV-Static-2.0 custom directory layout
        async function initProxy() {
            if ('serviceWorker' in navigator) {
                try {
                    // Targets the service worker located inside the active/ repository subfolder
                    await navigator.serviceWorker.register('/uv.sw.js', {
                        scope: __uv$config.prefix
                    });
                    console.log('Ultraviolet registered successfully via UV-Static pathing.');
                    loadUrl();
                } catch (err) {
                    console.error('Ultraviolet registration failed:', err);
                }
            }
        }

        function loadUrl() {
            let input = urlInput.value.trim();
            if (!input) return;

            // Simple fallback search engine if the entry lacks a top-level domain
            if (!input.includes('.')) {
                input = 'https://google.com/' + encodeURIComponent(input);
            } else {
                if (!/^https?:\/\//i.test(input)) {
                    input = 'https://' + input;
                }
            }

            // Construct proxy URL using the loaded configurations
            const proxyUrl = __uv$config.prefix + __uv$config.encodeUrl(input);
            viewport.src = proxyUrl;
        }

        // Event Listeners
        urlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadUrl();
            }
        });

        refreshBtn.addEventListener('click', function() {
            viewport.src = viewport.src;
        });

        // Initialize setup on window load
        initProxy();
    </script>
</body>
</html>
