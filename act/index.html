    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Particle Background */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Content Container */
        .content-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Centered Adaptive Iframe styling placed above the taskbar */
        .iframe-container {
            width: 85%;
            height: calc(100vh - 280px);
            background: #ffffff; 
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: none; /* Hidden initially */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 140px; /* Forces spacing directly above the taskbar */
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fixed Button Navigation Bar at Bottom */
        .bottom-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 20;
        }

        .icon-box {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Custom SVG Icon Styling */
        .icon-box svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Simple click/hover response */
        .icon-box:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .icon-box:active {
            transform: translateY(1px);
        }
    </style>
</head>

    <script>
        // Initialize particles.js
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "anim": { "enable": false } },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 140, "color": "#ffffff", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 2.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "repulse" },
                    "onclick": { "enable": true, "mode": "push" }
                },
                "modes": {
                    "repulse": { "distance": 100, "duration": 0.4 }
                }
            },
            "retina_detect": true
        });

        // Function to handle iframe switching and heading removal
        function loadIframe(url) {
            const title = document.getElementById('welcomeTitle');
            const wrapper = document.getElementById('iframeWrapper');
            const iframe = document.getElementById('mainIframe');
            
            // 1. Fade out and slide up the welcome text
            if (title.style.display !== 'none') {
                title.style.opacity = '0';
                title.style.transform = 'translateY(-20px)';
                
                // Remove from document layout once transition completes
                setTimeout(() => {
                    title.style.display = 'none';
                    // Expand iframe height slightly now that title is gone
                    wrapper.style.height = 'calc(100vh - 180px)';
                }, 400);
            }

            // 2. Load and smoothly display the iframe
            iframe.src = url;
            if (wrapper.style.display !== 'block') {
                wrapper.style.display = 'block';
                // Small delay to trigger CSS transition smoothly
                setTimeout(() => {
                    wrapper.style.opacity = '1';
                    wrapper.style.transform = 'translateY(0)';
                }, 50);
            }
        }
    </script>
