<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      .html-container { 
        width: 100%; 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        border: none; 
      }
      .responsive-iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        overflow: auto; 
      }
    </style>
  </defs>

  <!-- The foreignObject acts as a scalable window -->
  <foreignObject width="1000" height="1000" class="html-container">
    <!-- Point 'src' directly to your actual HTML file -->
    <iframe class="responsive-iframe" src="/index.html"></iframe>
  </foreignObject>
</svg>
