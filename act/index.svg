<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Store raw, unescaped HTML safely inside an XML CDATA block -->
    <script id="html-source" type="text/plain">
      <![CDATA[
      
      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zaka13s site</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Particle Background */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Content Container */
        .content-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Centered Adaptive Iframe styling placed above the taskbar */
        .iframe-container {
            width: 85%;
            height: calc(100vh - 280px);
            background: #ffffff; 
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: none; /* Hidden initially */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 140px; /* Forces spacing directly above the taskbar */
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fixed Button Navigation Bar at Bottom */
        .bottom-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 20;
        }

        .icon-box {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Custom SVG Icon Styling */
        .icon-box svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Simple click/hover response */
        .icon-box:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .icon-box:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Particle JS Background Container -->
    <div id="particles-js"></div>

    <!-- Main Dynamic Interface -->
    <div class="content-container">
        <h1 id="welcomeTitle">Welcome</h1>
        
        <!-- Center Stage Iframe container -->
        <div id="iframeWrapper" class="iframe-container">
            <iframe id="mainIframe" src=""></iframe>
        </div>

        <!-- Bottom Action Navigation -->
        <div class="bottom-nav">
            <!-- Icon 1: Game Controller -->
            <div class="icon-box" onclick="loadIframe('')">
                <svg viewBox="0 0 24 24">
                    <line x1="6" y1="12" x2="10" y2="12"></line>
                    <line x1="8" y1="10" x2="8" y2="14"></line>
                    <line x1="15" y1="13" x2="15.01" y2="13"></line>
                    <line x1="18" y1="11" x2="18.01" y2="11"></line>
                    <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                </svg>
            </div>
            
            <!-- Icon 2: Browser/Web Globe -->
            <div class="icon-box" onclick="loadIframe('https://gcore.jsdelivr.net/gh/zaka13X/sj@main/working.svg')">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
            </div>
            
            <!-- Icon 3: Settings Gear -->
            <div class="icon-box" onclick="loadIframe('/settings.html')">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.52-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- particles.js lib -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Initialize particles.js
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "anim": { "enable": false } },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 140, "color": "#ffffff", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 2.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "repulse" },
                    "onclick": { "enable": true, "mode": "push" }
                },
                "modes": {
                    "repulse": { "distance": 100, "duration": 0.4 }
                }
            },
            "retina_detect": true
        });

        // Function to handle iframe switching and heading removal
        function loadIframe(url) {
            const title = document.getElementById('welcomeTitle');
            const wrapper = document.getElementById('iframeWrapper');
            const iframe = document.getElementById('mainIframe');
            
            // 1. Fade out and slide up the welcome text
            if (title.style.display !== 'none') {
                title.style.opacity = '0';
                title.style.transform = 'translateY(-20px)';
                
                // Remove from document layout once transition completes
                setTimeout(() => {
                    title.style.display = 'none';
                    // Expand iframe height slightly now that title is gone
                    wrapper.style.height = 'calc(100vh - 180px)';
                }, 400);
            }

            // 2. Load and smoothly display the iframe
            iframe.src = url;
            if (wrapper.style.display !== 'block') {
                wrapper.style.display = 'block';
                // Small delay to trigger CSS transition smoothly
                setTimeout(() => {
                    wrapper.style.opacity = '1';
                    wrapper.style.transform = 'translateY(0)';
                }, 50);
            }
        }
    </script>
</body>
</html>
    
      ]]>
    </script>

    <style>
      .html-container { width: 100%; height: 100%; margin: 0; padding: 0; border: none; }
      .responsive-iframe { width: 100%; height: 100%; border: none; overflow: hidden; }
    </style>
  </defs>

  <foreignObject width="1000" height="1000" class="html-container">
    <!-- The iframe starts empty and is populated on execution -->
    <iframe id="target-iframe" class="responsive-iframe"></iframe>
  </foreignObject>

  <!-- Script to inject the raw CDATA text into the iframe's srcdoc -->
  <script type="text/javascript">
    <![CDATA[
    document.addEventListener("DOMContentLoaded", function() {
      var rawHtml = document.getElementById("html-source").textContent;
      document.getElementById("target-iframe").srcdoc = rawHtml;
    });
    ]]>
  </script>
</svg>
