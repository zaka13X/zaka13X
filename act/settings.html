<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <!-- particles.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            background: rgba(10, 10, 10, 0.9);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 1px solid #222222;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
        }

        p {
            color: #888888;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
            font-weight: normal;
        }

        button:hover {
            background-color: #222222;
            border-color: #555555;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
            background-color: #050505;
        }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <div id="particles-js"></div>

    <!-- UI Content -->
    <div class="content">
        <h1>Window Cloaker</h1>
        <p>Choose a method</p>
        <div class="btn-container">
            <button onclick="openBlobCloak()">Open Blob Cloak</button>
            <button onclick="openAboutBlankCloak()">Open About:Blank</button>
        </div>
    </div>

    <!-- Particle Script Initialization -->
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 70, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: { value: 0.2, random: true },
                size: { value: 2.5, random: true },
                line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.1, width: 1 },
                move: { enable: true, speed: 3, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
            },
            interactivity: {
                detect_on: "canvas",
                events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" } },
                modes: { grab: { distance: 200, line_linked: { opacity: 0.4 } } }
            },
            retina_detect: true
        });

        // Generates an iframe cloaked in a Blob URL
        function openBlobCloak() {
            const pageUrl = window.location.href;
            const iframeHtml = `<!DOCTYPE html>
<html>
<head><title>SSO Login</title></head>
<body style="margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;border:none;background-color:#000000;">
<iframe src="https://zaka.qzz.io/act" style="width:100%;height:100%;border:none;margin:0;"></iframe>
</body></html>`;

            const blob = new Blob([iframeHtml], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            
            const newTab = window.open('about:blank', '_blank');
            newTab.location.href = blobUrl;
        }

        // Generates an iframe cloaked inside an about:blank window
        function openAboutBlankCloak() {
            const pageUrl = window.location.href;
            const win = window.open();
            
            if (win) {
                win.document.body.style.margin = "0";
                win.document.body.style.padding = "0";
                win.document.body.style.overflow = "hidden";
                win.document.body.style.backgroundColor = "#000000";
                
                const iframe = win.document.createElement('iframe');
                iframe.src = pageUrl;
                iframe.style.width = "100vw";
                iframe.style.height = "100vh";
                iframe.style.border = "none";
                iframe.style.margin = "0";
                
                win.document.body.appendChild(iframe);
            }
        }
    </script>
</body>
</html>
