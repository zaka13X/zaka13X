<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data URL Encoder</title>
    <style>
        /* Base Setup */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #f0f0f0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* Particle Canvas System */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main App Layout Container */
        .app-container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h1 { 
            margin-bottom: 5px; 
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }
        p { color: #aaa; margin-top: 0; margin-bottom: 25px;}
        
        .type-selector {
            margin: 20px 0;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }
        
        label {
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ddd;
        }
        label:hover { color: #fff; }

        textarea {
            width: 100%;
            height: 180px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            background: rgba(15, 15, 15, 0.8);
            color: #fff;
            backdrop-filter: blur(4px);
        }
        textarea:focus {
            outline: none;
            border-color: #0076ff;
            box-shadow: 0 0 8px rgba(0, 118, 255, 0.4);
        }

        /* SVG Icon Conversion Button */
        .encode-btn {
            background-color: #0076ff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(0, 118, 255, 0.3);
        }
        .encode-btn:hover { 
            background-color: #1a85ff; 
            transform: translateY(-1px);
        }
        .encode-btn:active { transform: translateY(1px); }
        .encode-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Output Viewport Panel */
        .output-box {
            margin-top: 30px;
            background: rgba(20, 20, 20, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .output-box h3 { margin-top: 0; color: #fff; }
        
        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .secondary-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .secondary-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- Particle Layer -->
    <canvas id="particleCanvas"></canvas>

    <!-- UI Interaction Layer -->
    <div class="app-container">
        <h1>Data URL Encoder</h1>
        <p>read above, genius</p>

        <!-- Format Selector Options -->
        <div class="type-selector">
            <span>Format Mode:</span>
            <label>
                <input type="radio" name="dataType" value="text/html" checked onchange="updatePlaceholder()"> HTML Document
            </label>
            <label>
                <input type="radio" name="dataType" value="image/svg+xml" onchange="updatePlaceholder()"> SVG Vector Graphics
            </label>
        </div>

        <!-- Layout Inputs -->
        <textarea id="codeInput" placeholder="<h1>Hello World</h1>"></textarea>
        
        <button class="encode-btn" onclick="generateDataURL()">
            <svg viewBox="0 0 24 24">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Generate Data URL
        </button>

        <!-- Output Handling Panels -->
        <div class="output-box">
            <h3>Generated Data URL:</h3>
            <textarea id="urlOutput" readonly placeholder="Your non-Base64 data URL will appear here..."></textarea>
            
            <div class="result-actions">
                <button class="secondary-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
                <button class="secondary-btn" style="background-color: #555;" onclick="testURL()">Test in New Tab</button>
            </div>
        </div>
    </div>

    <script>
        /* --- Particle System Script Logic --- */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Loop edges smoothly
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize 75 white drifting particles
        for (let i = 0; i < 75; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();


        /* --- Core Encoder Functional Logic --- */
        function updatePlaceholder() {
            const mode = document.querySelector('input[name="dataType"]:checked').value;
            const inputArea = document.getElementById('codeInput');
            
            if (mode === 'image/svg+xml') {
                inputArea.placeholder = '<svg xmlns="http://w3.org" width="100" height="100">\n  <circle cx="50" cy="50" r="40" fill="red" />\n</svg>';
            } else {
                inputArea.placeholder = '<h1>Hello World</h1>';
            }
        }

        function generateDataURL() {
            const rawCode = document.getElementById('codeInput').value;
            const selectedMime = document.querySelector('input[name="dataType"]:checked').value;
            
            if (!rawCode.trim()) {
                alert('Please paste some code first!');
                return;
            }

            const encodedData = encodeURIComponent(rawCode);
            const dataURL = `data:${selectedMime},${encodedData}`;
            
            document.getElementById('urlOutput').value = dataURL;
        }

        function copyToClipboard() {
            const outputTextarea = document.getElementById('urlOutput');
            if (!outputTextarea.value) return;
            
            outputTextarea.select();
            document.execCommand('copy');
            alert('Data URL copied');
        }

        function testURL() {
            const dataURL = document.getElementById('urlOutput').value;
            if (!dataURL) return;
            window.open(dataURL, '_blank');
        }
    </script>
</body>
</html>
