<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zaka's stuff- I guess</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a192f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e6f1ff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .title {
            font-size: 2rem;
            font-weight: 500;
            color: #64ffda;
            letter-spacing: 1px;
        }

        .grid-large {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .grid-small {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: rgba(17, 34, 64, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 30px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #64ffda;
        }

        .card-large {
            min-height: 250px;
        }

        .card-small {
            min-height: 180px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ccd6f6;
        }

        .card-small h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .card p {
            color: #8892b0;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-small p {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .card a, .cloak-btn {
            color: #64ffda;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            padding: 0;
        }

        .card a:hover, .cloak-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="content-wrapper">
        <header>
            <h1 class="title">zaka's stuff (beta)</h1>
        </header>

        <main>
            <!-- 3 Big Sections -->
            <div class="grid-large">
                <section class="card card-large">
                    <h2>Zakas Games</h2>
                    <p></p>
                    <a href="https://zakas-ubg.vercel.app/">GO</a>
                </section>
                <section class="card card-large">
                    <h2>UV-Static 2.0 (built-in)</h2>
                    <p>Yep, Static Ultraviolet built into the site.</p>
                    <a href="/staticuv.html">Click here!</a>
                </section>
                <section class="card card-large">
                    <h2>Scramjet (built-in)</h2>
                    <p>You probably already know what this is. Scramjet static modified.</p>
                    <a href="/scramjet.html">Click me!</a>
                </section>
            </div>

            <!-- 2 Smaller Sections (Updated with working Cloak Launchers) -->
            <div class="grid-small">
                <section class="card card-small">
                    <h2>Study</h2>
                    <p>My studies.</p>
                    <button class="cloak-btn" onclick="openBlobPortal()">Study here!</button>
                </section>
                <section class="card card-small">
                    <h2>code</h2>
                    <p>just boring code.</p>
                    <button class="cloak-btn" onclick="openBlobPortal()">idk</button>
                </section>
            </div>
        </main>
    </div>

    <script>
        // Formulated Blob Launch Strategy
        function openBlobPortal() {
            const targetUrl = '/proxys.html';

            // Complete iframe shell definition
            // NOTICE: "allow-top-navigation" is excluded to keep page changes trapped inside the frame container
            const templateMarkup = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>Application View</title>
                    <style>
                        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; }
                        iframe { border: none; width: 100%; height: 100%; }
                    </style>
                </head>
                <body>
                    <iframe 
                        src="${targetUrl}" 
                        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-popups-to-escape-sandbox"
                        allow="geolocation; microphone; camera; clipboard-write;">
                    </iframe>
                </body>
                </html>
            `;

            // Pack the markup content safely into a local memory reference
            const markupBlob = new Blob([templateMarkup], { type: 'text/html' });
            const directUrl = URL.createObjectURL(markupBlob);

            // Trigger window environment generation natively
            const portalTab = window.open(directUrl, '_blank');

            if (!portalTab) {
                alert('Pop-up blocked! Please allow pop-ups for this site to deploy the container.');
            }
        }

        // Background Particle Logic Engine
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 60;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resizeCanvas();
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        init();
        animate();
    </script>
</body>
</html>
