<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/zaka13X/zaka13X@main/nonsense/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zakas homepage</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --section-bg: #1a1a1a;
            --accent-red: #e63946;
            --hover-red: #b81d24;
            --text-color: #ffffff;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .section {
            background-color: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .section-header {
            width: 100%;
            background-color: #111;
            color: var(--text-color);
            border: none;
            outline: none;
            padding: 20px;
            text-align: left;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header:hover {
            background-color: var(--accent-red);
            color: #fff;
        }

        .section-content {
            display: none;
            padding: 20px;
            background-color: #151515;
            border-top: 1px solid var(--border-color);
        }

        .section.active .section-content {
            display: block;
        }

        .controls-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .fullscreen-btn {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .fullscreen-btn:hover {
            background-color: var(--hover-red);
        }

        .iframe-container {
            position: relative;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid var(--accent-red);
            border-radius: 6px;
            background-color: #fff;
            box-sizing: border-box;
        }

        .close-fullscreen-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .close-fullscreen-btn:hover {
            background-color: var(--hover-red);
        }

        .iframe-container.window-fullscreen iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border: none;
            border-radius: 0;
        }

        .iframe-container.window-fullscreen .close-fullscreen-btn {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Section 1 -->
        <div class="section">
            <button class="section-header" onclick="toggleSection(this)">
                <span>Games</span>
                <span>▼</span>
            </button>
            <div class="section-content">
                <div class="controls-wrapper">
                    <button class="fullscreen-btn" onclick="goWindowFullscreen('container1')">Full Screen</button>
                </div>
                <div id="container1" class="iframe-container">
                    <button class="close-fullscreen-btn" onclick="exitWindowFullscreen('container1')">✕ Close Fullscreen</button>
                    <iframe src="https://cdn.esm.sh/gh/zaka13X/zaka13X@1cf4201/games/SingleFile.html" title="Section 1 Content"></iframe>
                </div>
            </div>
        </div>

        <!-- Section 2 -->
        <div class="section">
            <button class="section-header" onclick="toggleSection(this)">
                <span>Ultraviolet</span>
                <span>▼</span>
            </button>
            <div class="section-content">
                <div class="controls-wrapper">
                    <button class="fullscreen-btn" onclick="goWindowFullscreen('container2')">Full Screen</button>
                </div>
                <div id="container2" class="iframe-container">
                    <button class="close-fullscreen-btn" onclick="exitWindowFullscreen('container2')">✕ Close Fullscreen</button>
                    <iframe src="https://zaka.qzz.io/active/" title="Section 2 Content"></iframe>
                </div>
            </div>
        </div>

        <!-- Section 3 -->
        <div class="section">
            <button class="section-header" onclick="toggleSection(this)">
                <span>Scramjet</span>
                <span>▼</span>
            </button>
            <div class="section-content">
                <div class="controls-wrapper">
                    <button class="fullscreen-btn" onclick="goWindowFullscreen('container3')">Full Screen</button>
                </div>
                <div id="container3" class="iframe-container">
                    <button class="close-fullscreen-btn" onclick="exitWindowFullscreen('container3')">✕ Close Fullscreen</button>
                    <iframe src="https://gcore.jsdelivr.net/gh/zaka13X/sj/working.svg" title="Section 3 Content"></iframe>
                </div>
            </div>
        </div>

        <!-- Section 4 -->
        <div class="section">
            <button class="section-header" onclick="toggleSection(this)">
                <span>Blob Cloak</span>
                <span>▼</span>
            </button>
            <div class="section-content">
                <div class="controls-wrapper">
                    <button class="fullscreen-btn" onclick="goWindowFullscreen('container4')">Full Screen</button>
                </div>
                <div id="container4" class="iframe-container">
                    <button class="close-fullscreen-btn" onclick="exitWindowFullscreen('container4')">✕ Close Fullscreen</button>
                    <iframe src="https://cdn.esm.sh/gh/zaka13X/zaka13X@30784c2/panick/cdnblob.html" title="Section 4 Content"></iframe>
                </div>
            </div>
        </div>

        <!-- Section 5 -->
        <div class="section">
            <button class="section-header" onclick="toggleSection(this)">
                <span>Login Cloak</span>
                <span>▼</span>
            </button>
            <div class="section-content">
                <div class="controls-wrapper">
                    <button class="fullscreen-btn" onclick="goWindowFullscreen('container5')">Full Screen</button>
                </div>
                <div id="container5" class="iframe-container">
                    <button class="close-fullscreen-btn" onclick="exitWindowFullscreen('container5')">✕ Close Fullscreen</button>
                    <iframe src="https://zaka.qzz.io/panick" title="Section 5 Content"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSection(button) {
            const section = button.parentElement;
            const isOpen = section.classList.contains('active');
            
            const allSections = document.querySelectorAll('.section');
            allSections.forEach(sec => sec.classList.remove('active'));

            if (!isOpen) {
                section.classList.add('active');
            }
        }

        function goWindowFullscreen(containerId) {
            const container = document.getElementById(containerId);
            container.classList.add('window-fullscreen');
            document.body.style.overflow = 'hidden';
        }

        function exitWindowFullscreen(containerId) {
            const container = document.getElementById(containerId);
            container.classList.remove('window-fullscreen');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
