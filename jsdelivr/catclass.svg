<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .btn-container {
        display: flex;
        gap: 10px;
        padding: 10px;
        background-color: #f0f0f0;
        border-bottom: 1px solid #ccc;
      }
      button {
        padding: 8px 16px;
        font-family: sans-serif;
        font-size: 14px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background-color: #0056b3;
      }
      .iframe-wrapper {
        width: 100%;
        height: calc(100% - 55px);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </defs>

  <!-- Control Panel and Content Area -->
  <foreignObject width="100%" height="100%" x="0" y="0">
    <body xmlns="http://www.w3.org/1999/xhtml" style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;">
      
      <!-- Navigation Buttons -->
      <div class="btn-container">
        <button onclick="changeUrl('https://classroom15x.net')">Link 1</button>
        <button onclick="changeUrl('https://green-cat.b-cdn.net/')">Link 2</button>
        <button onclick="changeUrl('https://boxmew27.becasuniversitarias.org/')">Link 3</button>
        <button onclick="changeUrl('https://heyyyyyyyy.b-cdn.net/')">Link 4</button>
        <button onclick="changeUrl('https://catjumping.tombu.net/')">Link 5</button>
      </div>

      <!-- Iframe Content Display -->
      <div class="iframe-wrapper">
        <iframe id="target-frame" src="https://green-cat.b-cdn.net/" scrolling="auto"></iframe>
      </div>

      <!-- JavaScript for switching URLs -->
      <script type="text/javascript">
        function changeUrl(newUrl) {
          document.getElementById('target-frame').src = newUrl;
        }
      </script>

    </body>
  </foreignObject>
</svg>
